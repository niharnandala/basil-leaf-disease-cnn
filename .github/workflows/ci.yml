name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        # TensorFlow is deliberately not installed here. These tests cover the
        # config contract and the recorded training history, which is what can
        # silently break; training itself needs a GPU-hour and a dataset.
        run: pip install pyyaml pytest ruff

      - name: Lint
        run: ruff check src app tests

      - name: Test
        run: pytest -q
        env:
          PYTHONPATH: .
